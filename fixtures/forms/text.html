<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: text fields (form library, validates on blur)</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
  label, .question-title { display: block; margin-top: 12px; }
  input, textarea { font: inherit; padding: 6px; width: 100%; box-sizing: border-box; }
  .error { color: #b3261e; font-size: 12px; }
  #fixture-state { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #f3f3f3; padding: 8px; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div id="root"></div>
<pre id="fixture-state"></pre>
<template id="form">
<form novalidate>
  <div class="field"><label for="first">First name *</label><input id="first" name="first" aria-invalid="false" aria-errormessage="first-error"></div>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" aria-invalid="false" aria-errormessage="email-error"></div>
  <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" aria-invalid="false" aria-errormessage="phone-error"></div>
  <div class="field"><label for="bio">About you</label><textarea maxlength="20" id="bio" name="bio" aria-invalid="false" aria-errormessage="bio-error"></textarea></div>
  <div class="field"><label for="account">Account ID</label><input readonly id="account" name="account" aria-invalid="false" aria-errormessage="account-error"></div>
  <div class="question"><div class="question-title">Where are you located?</div><input placeholder="Start typing..." name="location"></div>
</form>
</template>
<script type="module">
import { createForm, errorSlot } from "./form.js";
import { installFixture, publishState } from "./harness.js";

const RULES = {
  first: { required: "Required", minLength: { value: 2, message: "Too short" } },
  email: { required: "Required", pattern: { value: /^[^@\s]+@[^@\s]+\.[^@\s]+$/, message: "Not an email" } },
};

function start() {
  const root = document.getElementById("root");
  root.append(document.getElementById("form").content.cloneNode(true));
  root.querySelector("form").addEventListener("submit", (e) => e.preventDefault());
  const shows = [];
  const form = createForm({ defaultValues: { account: "A-1001" }, onUpdate: () => shows.forEach((show) => show()) });
  for (const el of root.querySelectorAll("form [name]")) {
    form.register(el.name, el, RULES[el.name]);
    if (!el.id) continue;
    const slot = errorSlot(el, `${el.id}-error`);
    shows.push(() => {
      const message = form.errorOf(el.name);
      el.setAttribute("aria-invalid", message ? "true" : "false");
      slot(message);
    });
  }
  publishState(() => form.state());
  installFixture();
}

const params = new URLSearchParams(location.search);
const delay = Number(params.get("hydrateAfter") ?? 0); // ?hydrateAfter=1500 for the late-form case
setTimeout(start, delay);
</script>
</body>
</html>
