<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: file uploads</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
  .autofill input { clip: rect(0 0 0 0); position: absolute; width: 1px; height: 1px; overflow: hidden; }
  .styled input[type=file] { display: none; }
  .styled button { padding: 6px 12px; }
  #fixture-state { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #f3f3f3; padding: 8px; }
</style>
</head>
<body>
<div id="root">
<form>
  <!-- The decoy comes first in the DOM, as on some application forms. -->
  <div class="autofill"><label for="autofill">Autofill from resume</label><input id="autofill" type="file"></div>
  <p><label for="resume">Resume</label><input id="resume" type="file" required></p>
  <div class="styled entry"><span class="question-title">Cover letter</span><input type="file"><button type="button">Upload file</button></div>
</form>
</div>
<pre id="fixture-state"></pre>
<script type="module">
import { watchChanges } from "./form.js";
import { installFixture, publishState } from "./harness.js";

const [autofill, resume, cover] = document.querySelectorAll("input[type=file]");
const values = { autofill: [], resume: [], cover: [] };
const names = (input) => Array.from(input.files).map((f) => `${f.name}:${f.size}`);
for (const [key, input] of Object.entries({ autofill, resume, cover })) watchChanges(input, () => (values[key] = names(input)));
document.querySelector(".styled button").addEventListener("click", () => cover.click());

publishState(() => ({ values: { ...values } }));
installFixture();
</script>
</body>
</html>
