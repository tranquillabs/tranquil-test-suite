<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: checkboxes, radios and Yes/No buttons</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
  fieldset, .entry { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin: 12px 0; }
  .question-title { font-weight: 600; display: block; margin-bottom: 6px; }
  /* Visually hidden inputs, as some application forms use: present and clickable only through their labels. */
  .hidden-box { opacity: 0; position: absolute; width: 1px; height: 1px; }
  .yesno button { padding: 6px 16px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; }
  .yesno button._active_ { background: #2d7788; color: #fff; }
  .yesno input { display: none; }
  #fixture-state { font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #f3f3f3; padding: 8px; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div id="root">
<form>
  <fieldset>
    <legend>Preferred work style</legend>
    <label style="display: block;"><input type="radio" value="Remote" name="workStyle"> Remote</label>
    <label style="display: block;"><input type="radio" value="Hybrid" name="workStyle"> Hybrid</label>
    <label style="display: block;"><input type="radio" value="On-site" name="workStyle"> On-site</label>
  </fieldset>

  <!-- Two questions whose radios share one name, as some application tracking systems render them. -->
  <div class="entry">
    <span class="question-title">Years of experience</span>
    <div><input type="radio" id="exp0" name="answer" value="0-2"><label for="exp0">0-2</label></div>
    <div><input type="radio" id="exp1" name="answer" value="3-5"><label for="exp1">3-5</label></div>
    <div><input type="radio" id="exp2" name="answer" value="6+"><label for="exp2">6+</label></div>
  </div>
  <div class="entry">
    <span class="question-title">Notice period</span>
    <div><input type="radio" id="notice0" name="answer" value="Immediately"><label for="notice0">Immediately</label></div>
    <div><input type="radio" id="notice1" name="answer" value="One month"><label for="notice1">One month</label></div>
  </div>

  <div class="entry">
    <span class="question-title">How did you hear about us?</span>
    <div><input type="checkbox" class="hidden-box" id="ch0" value="LinkedIn" name="channels"><label for="ch0">LinkedIn</label></div>
    <div><input type="checkbox" class="hidden-box" id="ch1" value="Referral" name="channels"><label for="ch1">Referral</label></div>
    <div><input type="checkbox" class="hidden-box" id="ch2" value="Website" name="channels"><label for="ch2">Website</label></div>
  </div>

  <!-- Yes/No questions drawn as two buttons plus a hidden checkbox, with the answer kept in script. -->
  <div class="entry">
    <span class="question-title">Are you authorized to work in the US?</span>
    <div class="yesno"><button type="button" aria-pressed="false" class="">Yes</button><button type="button" aria-pressed="false" class="">No</button><input type="checkbox" name="authorized" tabindex="-1" readonly></div>
  </div>
  <div class="entry">
    <span class="question-title">Willing to relocate?</span>
    <div class="yesno"><button type="button" aria-pressed="false" class="">Yes</button><button type="button" aria-pressed="false" class="">No</button><input type="checkbox" name="relocate" tabindex="-1" readonly></div>
  </div>

  <!-- Some server frameworks render a hidden twin before the real checkbox, under the same name. -->
  <input type="hidden" name="consent" value="0">
  <label><input type="checkbox" value="1" name="consent"> I agree to the privacy policy</label>
</form>
</div>
<pre id="fixture-state"></pre>
<script type="module">
import { createForm, watchChanges } from "./form.js";
import { installFixture, publishState } from "./harness.js";

const all = (selector) => [...document.querySelectorAll(selector)];
document.querySelector("form").addEventListener("submit", (e) => e.preventDefault());

const form = createForm({ defaultValues: { channels: [] } });
form.register("workStyle", all("input[name=workStyle]"));
form.register("channels", all("input[name=channels]"));
form.register("consent", document.querySelector("input[type=checkbox][name=consent]"));

// Answers kept by the page's own script, not the form library.
const answers = { authorized: null, relocate: null, experience: null, notice: null };
for (const [key, prefix] of [["experience", "exp"], ["notice", "notice"]]) {
  for (const radio of all(`input[id^=${prefix}]`)) watchChanges(radio, () => (answers[key] = radio.value));
}
for (const group of all(".yesno")) {
  const box = group.querySelector("input");
  const buttons = [...group.querySelectorAll("button")];
  for (const button of buttons) {
    button.addEventListener("click", () => {
      answers[box.name] = button.textContent;
      for (const b of buttons) {
        const on = answers[box.name] === b.textContent;
        b.setAttribute("aria-pressed", String(on));
        b.className = on ? "_active_" : "";
      }
      box.checked = answers[box.name] === "Yes";
    });
  }
}

publishState(() => {
  const { values, touched } = form.state();
  return { values: { ...values, ...answers }, touched };
});
installFixture();
</script>
</body>
</html>
